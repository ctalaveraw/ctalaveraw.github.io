name: Publish portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure container identity
        run: |
          printf 'RUN_AS=%s:%s\n' "$(id -u)" "$(id -g)" > .env

      - name: Build development image
        run: docker compose build portfolio

      - name: Verify and build
        run: |
          docker compose run --rm --no-deps portfolio \
            sh -euc 'npm ci && npm run verify'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
