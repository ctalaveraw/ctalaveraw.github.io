name: Temporary formatting export

on:
  push:
    branches:
      - feat/evidence-backed-lab-notes
    paths:
      - .github/workflows/temp-format-export.yml

permissions:
  contents: write

jobs:
  export:
    name: format-export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Configure container identity
        run: |
          printf 'RUN_AS=%s:%s\n' "$(id -u)" "$(id -g)" > .env

      - name: Apply repository formatter
        run: |
          docker compose build portfolio
          docker compose run --rm --no-deps portfolio sh -euc 'npm ci && npm run format'

      - name: Commit formatting to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Header.astro src/components/LabNotes.astro src/pages/lab-notes/index.astro tests/e2e/lab-notes.spec.ts
          if git diff --cached --quiet; then
            echo 'No formatting differences'
            exit 0
          fi
          git commit -m 'style: apply pinned formatter to lab note UI'
          git push origin HEAD:feat/evidence-backed-lab-notes
