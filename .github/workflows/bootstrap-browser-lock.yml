name: Temporary browser lock metadata

on:
  push:
    branches:
      - test/playwright-browser-interactions

permissions:
  contents: read

jobs:
  lock-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate lockfile metadata
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact --save-dev @playwright/test@1.65.1
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const pkgs = Object.fromEntries(
            Object.entries(lock.packages).filter(([key]) =>
              /node_modules\/(?:@playwright\/test|playwright|playwright-core)$/.test(key),
            ),
          );
          console.log('PLAYWRIGHT_LOCK_START' + JSON.stringify({ root: lock.packages[''], pkgs }) + 'PLAYWRIGHT_LOCK_END');
          NODE
