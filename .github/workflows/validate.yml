name: Portfolio CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure container identity
        run: |
          printf 'RUN_AS=%s:%s\n' "$(id -u)" "$(id -g)" > .env

      - name: Build development image
        run: docker compose build portfolio

      - name: Run verification
        run: |
          docker compose run --rm --no-deps portfolio \
            sh -euc 'npm ci && npm run verify'

      - name: Upload site preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview
          path: dist/
          retention-days: 7
